# Dependabot auto-merge, free (GitHub Actions + the built-in token; no third-party service).
#
# A Dependabot PR is merged by this workflow only when ALL of these hold:
#   - opened by dependabot[bot], every commit authored by dependabot[bot], targets the default branch
#   - every update in it is a patch or minor version (read from Dependabot's own commit
#     metadata, `update-type: version-update:semver-*`); majors always wait for a human
#   - every check on the PR's head commit has finished green
#   (no approval step: this repo has no branch rules and deploys nowhere)
# It never checks out or runs the PR's code: it only reads the PR through the API and merges it.
# A merge made with the built-in token does not start push workflows, so it then starts
# the daily security audit on main once more (nothing here deploys).
name: dependabot-automerge

on:
  workflow_run:
    workflows: ["ci", "cli + action"]
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.state == 'approved'
        && github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - uses: actions/github-script@v7
        env:
          REQUIRE_APPROVAL: "false"
          DISPATCH: "security-audit.yml"
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARK = "<!-- dependabot-automerge -->";
            const say = async (n, body) => {
              const cs = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n });
              const mine = cs.find((c) => c.body && c.body.startsWith(MARK));
              const text = `${MARK}\n${body}`;
              if (mine) { if (mine.body !== text) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: text }); }
              else await github.rest.issues.createComment({ owner, repo, issue_number: n, body: text });
            };

            const n = context.eventName === "workflow_run"
              ? (context.payload.workflow_run.pull_requests || [])[0]?.number
              : context.payload.pull_request.number;
            if (!n) return core.info("no pull request attached to this run");
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
            if (pr.state !== "open") return core.info(`#${n} is ${pr.state}`);
            if (pr.user.login !== "dependabot[bot]") return core.info("not a Dependabot PR");
            if (pr.base.ref !== pr.base.repo.default_branch) return core.info("does not target the default branch");

            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: n });
            if (commits.some((c) => c.author?.login !== "dependabot[bot]")) {
              return say(n, "Not auto-merging: this PR has commits that were not made by Dependabot. Review it by hand.");
            }
            const types = [...commits.map((c) => c.commit.message).join("\n").matchAll(/update-type:\s*version-update:semver-(major|minor|patch)/g)].map((m) => m[1]);
            if (types.length === 0) return say(n, "Not auto-merging: no Dependabot version metadata found. Review it by hand.");
            if (types.includes("major")) return say(n, "Not auto-merging: this is a **major** version update, which can break things. Review and merge it by hand.");

            const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 });
            const checks = runs.filter((r) => r.name !== "automerge");
            const pending = checks.filter((r) => r.status !== "completed");
            const failed = checks.filter((r) => r.status === "completed" && !["success", "skipped", "neutral"].includes(r.conclusion));
            if (failed.length) return say(n, `Not auto-merging: failing checks (${failed.map((r) => r.name).join(", ")}).`);
            if (checks.length === 0 || pending.length) return core.info(`waiting: ${checks.length} checks, ${pending.length} still running`);

            if (process.env.REQUIRE_APPROVAL === "true") {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: n });
              const latest = new Map();
              for (const r of reviews) if (["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(r.state)) latest.set(r.user.login, r.state);
              if ([...latest.values()].includes("CHANGES_REQUESTED")) return core.info("changes requested");
              let ok = false;
              for (const [login, state] of latest) {
                if (state !== "APPROVED") continue;
                const { data: p } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                if (["admin", "write"].includes(p.permission)) ok = true;
              }
              if (!ok) return say(n, `Safe update (${[...new Set(types)].join(" + ")} only) and every check is green. **Approve this PR to merge and deploy it** — nothing else to do.`);
            }

            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: n, sha: pr.head.sha, merge_method: "squash" });
            } catch (e) {
              return say(n, `Tried to auto-merge but GitHub refused: ${e.message}`);
            }
            core.info(`merged #${n}`);
            await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }).catch(() => {});
            for (const wf of process.env.DISPATCH.split(",").map((s) => s.trim()).filter(Boolean)) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref: pr.base.ref });
              core.info(`started ${wf} on ${pr.base.ref}`);
            }
